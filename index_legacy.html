<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heels Catalog</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(255, 255, 255, 0.06);
        --panel2: rgba(255, 255, 255, 0.08);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
        --border: rgba(255, 255, 255, 0.12);
        --accent: #7c5cff;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--text);
        background: radial-gradient(1200px 800px at 20% 10%, rgba(124, 92, 255, 0.25), transparent 60%),
          radial-gradient(1000px 700px at 80% 20%, rgba(0, 187, 255, 0.18), transparent 55%),
          var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC",
          "Microsoft JhengHei", Arial, sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(10px);
        background: linear-gradient(to bottom, rgba(11, 16, 32, 0.86), rgba(11, 16, 32, 0.55));
        border-bottom: 1px solid var(--border);
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
      }

      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        font-size: 18px;
        margin: 0;
        letter-spacing: 0.2px;
      }

      .count {
        color: var(--muted);
        font-size: 13px;
      }

      .layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 14px;
        align-items: start;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
        padding: 14px 14px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .panel .content {
        padding: 12px 14px 14px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }

      label {
        font-size: 12px;
        color: var(--muted);
      }

      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text);
        outline: none;
      }

      input[type="text"]:focus {
        border-color: rgba(124, 92, 255, 0.6);
        box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.14);
      }

      .btn {
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: var(--text);
        padding: 9px 10px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 13px;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.09);
      }

      .group {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.12);
        border-radius: 12px;
        padding: 10px;
      }

      .groupTitle {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .checks {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        max-height: 180px;
        overflow: auto;
        padding-right: 6px;
      }

      .check {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 13px;
      }

      .check input {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }

      .rangeRow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        align-items: center;
      }

      .rangeBox {
        display: grid;
        gap: 8px;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(0, 0, 0, 0.12);
      }

      .rangeBox .val {
        font-size: 12px;
        color: var(--muted);
      }

      input[type="range"] {
        width: 100%;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: rgba(0, 0, 0, 0.18);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .meta {
        padding: 12px 12px 14px;
        display: grid;
        gap: 10px;
      }

      .filename {
        font-size: 13px;
        color: var(--text);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(124, 92, 255, 0.12);
        border: 1px solid rgba(124, 92, 255, 0.26);
        padding: 6px 8px;
        border-radius: 999px;
      }

      .tag.muted {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.12);
      }

      .empty {
        padding: 18px;
        color: var(--muted);
        border: 1px dashed rgba(255, 255, 255, 0.18);
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.08);
      }

      a.small {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.75);
        text-decoration: none;
      }
      a.small:hover {
        color: rgba(255, 255, 255, 0.9);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap titlebar">
        <h1>鞋子資料 / 可篩選</h1>
        <div class="count" id="count">—</div>
      </div>
    </header>

    <div class="wrap layout">
      <section class="panel">
        <h2>Filters</h2>
        <div class="content">
          <div class="field">
            <label for="q">搜尋（檔名/屬性）</label>
            <input id="q" type="text" placeholder="例如：黑 / 細跟 / 露趾 / T字帶…" />
          </div>

          <div class="field">
            <div class="row" style="justify-content: space-between">
              <label>鞋跟高度（cm）</label>
              <button class="btn" id="reset">重設</button>
            </div>
            <div class="rangeRow">
              <div class="rangeBox">
                <div class="val">最小：<span id="minVal">—</span></div>
                <input id="minH" type="range" min="0" max="20" step="0.5" value="0" />
              </div>
              <div class="rangeBox">
                <div class="val">最大：<span id="maxVal">—</span></div>
                <input id="maxH" type="range" min="0" max="20" step="0.5" value="20" />
              </div>
            </div>
          </div>

          <div class="field">
            <div class="group">
              <div class="groupTitle">款式</div>
              <div class="checks" id="styleChecks"></div>
            </div>
          </div>

          <div class="field">
            <div class="group">
              <div class="groupTitle">鞋頭</div>
              <div class="checks" id="toeChecks"></div>
            </div>
          </div>

          <div class="field">
            <div class="group">
              <div class="groupTitle">鞋跟樣式</div>
              <div class="checks" id="heelChecks"></div>
            </div>
          </div>

          <div class="field">
            <div class="group">
              <div class="groupTitle">材質</div>
              <div class="checks" id="matChecks"></div>
            </div>
          </div>

          <div class="field">
            <div class="group">
              <div class="groupTitle">顏色</div>
              <div class="checks" id="colorChecks"></div>
            </div>
          </div>

          <div style="color: rgba(255, 255, 255, 0.55); font-size: 12px; line-height: 1.4">
            縮圖放在 <code>thumbs/</code>。要新增資料請改 <code>data.js</code>。
          </div>
        </div>
      </section>

      <main>
        <div id="grid" class="grid"></div>
        <div id="empty" class="empty" style="display: none">沒有符合的項目</div>
      </main>
    </div>

    <script src="./data.js"></script>
    <script>
      const data = Array.isArray(window.SHOE_DATA) ? window.SHOE_DATA : [];

      const $ = (sel) => document.querySelector(sel);
      const gridEl = $("#grid");
      const emptyEl = $("#empty");
      const countEl = $("#count");
      const qEl = $("#q");
      const minEl = $("#minH");
      const maxEl = $("#maxH");
      const minValEl = $("#minVal");
      const maxValEl = $("#maxVal");
      const resetEl = $("#reset");

      const groups = [
        { key: "style", title: "款式", mount: $("#styleChecks") },
        { key: "toe", title: "鞋頭", mount: $("#toeChecks") },
        { key: "heelStyle", title: "鞋跟樣式", mount: $("#heelChecks") },
        { key: "material", title: "材質", mount: $("#matChecks") },
        { key: "color", title: "顏色", mount: $("#colorChecks") },
      ];

      const selected = Object.fromEntries(groups.map((g) => [g.key, new Set()]));

      function uniqValues(key) {
        const set = new Set();
        for (const item of data) {
          const v = (item?.[key] ?? "").toString().trim();
          if (v) set.add(v);
        }
        return Array.from(set).sort((a, b) => a.localeCompare(b, "zh-Hant"));
      }

      function renderChecks(group) {
        const values = uniqValues(group.key);
        group.mount.innerHTML = "";

        if (!values.length) {
          group.mount.innerHTML = `<div style="color: rgba(255,255,255,.55); font-size: 12px">（無）</div>`;
          return;
        }

        for (const v of values) {
          const id = `chk_${group.key}_${btoa(unescape(encodeURIComponent(v))).replace(/=+$/g, "")}`;
          const row = document.createElement("label");
          row.className = "check";
          row.setAttribute("for", id);
          row.innerHTML = `
            <input id="${id}" type="checkbox" />
            <span>${escapeHtml(v)}</span>
          `;
          row.querySelector("input").addEventListener("change", (e) => {
            if (e.target.checked) selected[group.key].add(v);
            else selected[group.key].delete(v);
            apply();
          });
          group.mount.appendChild(row);
        }
      }

      function escapeHtml(s) {
        return (s ?? "")
          .toString()
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function inSelectedSet(key, value) {
        const set = selected[key];
        if (!set || set.size === 0) return true;
        return set.has((value ?? "").toString().trim());
      }

      function matchQuery(item, q) {
        if (!q) return true;
        const hay = [
          item?.filename,
          item?.style,
          item?.toe,
          item?.heelStyle,
          item?.material,
          item?.color,
          item?.heelHeightCm,
        ]
          .filter(Boolean)
          .join(" / ")
          .toLowerCase();
        return hay.includes(q.toLowerCase());
      }

      function apply() {
        const q = (qEl.value ?? "").trim();
        let minH = Number(minEl.value);
        let maxH = Number(maxEl.value);
        if (minH > maxH) {
          const tmp = minH;
          minH = maxH;
          maxH = tmp;
        }
        minValEl.textContent = minH.toFixed(1).replace(/\.0$/, "");
        maxValEl.textContent = maxH.toFixed(1).replace(/\.0$/, "");

        const filtered = data.filter((item) => {
          const h = Number(item?.heelHeightCm);
          const inHeight = Number.isFinite(h) ? h >= minH && h <= maxH : true;
          return (
            inHeight &&
            matchQuery(item, q) &&
            inSelectedSet("style", item?.style) &&
            inSelectedSet("toe", item?.toe) &&
            inSelectedSet("heelStyle", item?.heelStyle) &&
            inSelectedSet("material", item?.material) &&
            inSelectedSet("color", item?.color)
          );
        });

        renderGrid(filtered);
        countEl.textContent = `${filtered.length} / ${data.length}`;
      }

      function tag(text, muted = false) {
        return `<span class="tag ${muted ? "muted" : ""}">${escapeHtml(text)}</span>`;
      }

      function renderGrid(items) {
        gridEl.innerHTML = "";
        if (!items.length) {
          emptyEl.style.display = "block";
          return;
        }
        emptyEl.style.display = "none";

        for (const item of items) {
          const card = document.createElement("article");
          card.className = "card";
          const heightText =
            Number.isFinite(Number(item?.heelHeightCm)) && item.heelHeightCm !== null && item.heelHeightCm !== undefined
              ? `${item.heelHeightCm}cm`
              : "—";
          const objectPos = (item?.objectPosition ?? "50% 50%").toString();
          const imgSrc = (item?.image ?? item?.thumb ?? "").toString();

          card.innerHTML = `
            <div class="thumb">
              <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(item.filename)}" loading="lazy" style="object-position: ${escapeHtml(
                objectPos
              )}" />
            </div>
            <div class="meta">
              <div class="filename">
                <div>${escapeHtml(item.filename)}</div>
                <a class="small" href="#" data-copy="${escapeHtml(item.filename)}" title="複製檔名">copy</a>
              </div>
              <div class="tags">
                ${tag(`款式：${item.style || "—"}`, true)}
                ${tag(`鞋頭：${item.toe || "—"}`, true)}
                ${tag(`鞋跟：${item.heelStyle || "—"}`, true)}
                ${tag(`高度：${heightText}`, false)}
                ${tag(`材質：${item.material || "—"}`, true)}
                ${tag(`顏色：${item.color || "—"}`, true)}
              </div>
            </div>
          `;

          const copyLink = card.querySelector("a[data-copy]");
          copyLink.addEventListener("click", async (e) => {
            e.preventDefault();
            try {
              await navigator.clipboard.writeText(item.filename);
              copyLink.textContent = "copied";
              setTimeout(() => (copyLink.textContent = "copy"), 800);
            } catch {
              copyLink.textContent = "failed";
              setTimeout(() => (copyLink.textContent = "copy"), 800);
            }
          });

          gridEl.appendChild(card);
        }
      }

      function initHeightRange() {
        const heights = data
          .map((x) => Number(x?.heelHeightCm))
          .filter((x) => Number.isFinite(x))
          .sort((a, b) => a - b);
        if (!heights.length) return;

        const min = Math.max(0, Math.floor(Math.min(...heights)));
        const max = Math.min(30, Math.ceil(Math.max(...heights)));
        minEl.min = String(min);
        minEl.max = String(max);
        maxEl.min = String(min);
        maxEl.max = String(max);
        minEl.value = String(min);
        maxEl.value = String(max);
      }

      for (const g of groups) renderChecks(g);
      initHeightRange();

      qEl.addEventListener("input", apply);
      minEl.addEventListener("input", apply);
      maxEl.addEventListener("input", apply);
      resetEl.addEventListener("click", () => {
        qEl.value = "";
        for (const g of groups) selected[g.key].clear();
        for (const input of document.querySelectorAll('input[type="checkbox"]')) input.checked = false;
        initHeightRange();
        apply();
      });

      apply();
    </script>
  </body>
</html>
