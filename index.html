        drawerOverlayEl.style.display = "none";
        drawerEl.setAttribute("aria-hidden", "true");
      }

      function toStrArray(v) {
        if (!v) return [];
        if (Array.isArray(v)) return v.map((x) => (x ?? "").toString().trim()).filter(Boolean);
        const s = (v ?? "").toString().trim();
        return s ? [s] : [];
      }

      function isUncensoredItem(item) {
        return toStrArray(item?.censor).some((x) => x === "無碼");
      }

      function getVideoIndex() {
        const vi = window.VIDEO_INDEX;
        if (!vi || typeof vi !== "object") return null;
        const byKey = vi.byKey && typeof vi.byKey === "object" ? vi.byKey : null;
        const root = (vi.root ?? "").toString();
        return byKey ? { byKey, root } : null;
      }

      function videoRelForItem(item) {
        const vi = getVideoIndex();
        if (!vi) return "";

        const keys = [];
        const code = (item?.code ?? "").toString().trim();
        if (code) keys.push(code);

        const variants = Array.isArray(item?.variants) ? item.variants : [];
        for (const v of variants) {
          const fn = (v?.filename ?? "").toString().trim();
          if (!fn) continue;
          const noExt = fn.replace(/\.[^.]+$/, "");
          const base = noExt.split(".")[0];
          if (base) keys.push(base);
        }

        // Try exact key then common uppercased key
        for (const k of keys) {
          const kk = (k ?? "").toString().trim().toUpperCase();
          if (!kk) continue;
          const val = vi.byKey[kk];
          if (typeof val === "string" && val) return val;
          if (Array.isArray(val) && val.length) return (val[0] ?? "").toString();
        }
        return "";
      }

      function fileUrlFromRootRel(rootWinPath, rel) {
        const root = (rootWinPath ?? "").toString().trim();
        const r = (rel ?? "").toString().trim().replaceAll("\\", "/");
        if (!root || !r) return "";
        // root like D:\Japan\Heels
        const rootSlashes = root.replaceAll("\\", "/").replace(/\/+$/g, "");
        const full = `${rootSlashes}/${r}`.replaceAll("\\", "/");
        // file:///D:/Japan/Heels/涼鞋/022417_003-caribpr-1080p.mp4
        const withDrive = full.replace(/^([A-Za-z]):\//, (_, d) => `${d}:/`);
        const segs = withDrive.split("/").filter((x) => x !== "");
        const enc = segs
          .map((seg, i) => {
            if (i === 0 && /^[A-Za-z]:$/.test(seg)) return seg; // keep drive colon
            return encodeURIComponent(seg);
          })
          .join("/");
        return `file:///${enc}`;
      }

      function mediaUrlFromRel(rel) {
        const r = (rel ?? "").toString().trim().replaceAll("\\", "/").replace(/^\/+/g, "");
        if (!r) return "";
        return `./media/${encodePathSegments(r)}`;
      }

      function openVideoPlayerForItem(item) {
        const rel = videoRelForItem(item);
        if (!rel) return false;
        const vi = getVideoIndex();
        const src =
          location && location.protocol && location.protocol.startsWith("http")
            ? mediaUrlFromRel(rel)
            : fileUrlFromRootRel(vi?.root || "D:\\Japan\\Heels", rel);
        if (!src) return false;
        const title = (item?.code ?? item?.filename ?? "").toString();
        const url = `player.html?src=${encodeURIComponent(src)}&title=${encodeURIComponent(title)}`;
        window.open(url, "_blank", "noopener");
        return true;
      }

      function encodePathSegments(path) {
        const p = (path ?? "").toString().replaceAll("\\", "/");
        return p
          .split("/")
          .map((seg) => encodeURIComponent(seg))
          .join("/");
      }

      async function fetchMediaSearch(q) {
        const query = (q ?? "").toString().trim();
        if (!query) return [];
        // Only works when served from tools/serve.ps1 (http://localhost:8787).
        if (!location || !location.protocol || !location.protocol.startsWith("http")) return [];
        try {
          const res = await fetch(`./media/search?q=${encodeURIComponent(query)}`, { cache: "no-store" });
          if (!res.ok) return [];
          const json = await res.json();
          const items = Array.isArray(json?.items) ? json.items : [];
          return items
            .map((it) => it?.Rel || it?.rel || "")
            .filter(Boolean)
            .map((rel) => `media/${encodePathSegments(rel)}`);
        } catch {
          return [];
        }
      }

      async function videoCandidatesFor(item, variants) {
        const out = [];
        const seen = new Set();
        const add = (p) => {
          const s = (p ?? "").toString().trim();
          if (!s) return;
          const k = s.toLowerCase();
          if (seen.has(k)) return;
          seen.add(k);
          out.push(s);
        };

        const code = (item?.code ?? "").toString().trim();
        const bases = [];
        if (code) bases.push(code);
        for (const v of Array.isArray(variants) ? variants : []) {
          const fn = (v?.filename ?? "").toString().trim();
          if (!fn) continue;
          const base = fn.replace(/\.[^.]+$/, "");
          if (base) bases.push(base);
        }

        // 1) Try media index (D:\Japan\Heels) via local server search.
        for (const b of bases) {
          const hits = await fetchMediaSearch(b);
          for (const h of hits) add(h);
        }

        // 2) Fallback: direct local folders under the site.
        const exts = ["mp4", "webm", "m4v", "mov"];
        for (const b of bases) for (const ext of exts) add(`videos/${b}.${ext}`);
        for (const b of bases) for (const ext of exts) add(`originals/${b}.${ext}`);

        return out.map((p) => encodeURI(p));
      }

      function showDrawerImage() {
        if (drawerVideoEl) drawerVideoEl.style.display = "none";
        if (drawerImgEl) drawerImgEl.style.display = "";
      }

      function showDrawerVideo() {
        if (drawerImgEl) drawerImgEl.style.display = "none";
        if (drawerVideoEl) drawerVideoEl.style.display = "block";
      }

      function stopDrawerVideo() {
        try {
          if (!drawerVideoEl) return;
          drawerVideoEl.pause();
          drawerVideoEl.removeAttribute("src");
          drawerVideoEl.load();
        } catch {
          // ignore
        }
      }

      let drawerMediaReqId = 0;

      function tryPlayVideoCandidates(candidates, idx = 0) {
        if (!drawerVideoEl) return;
        const list = Array.isArray(candidates) ? candidates : [];
        if (!list.length || idx >= list.length) {
          stopDrawerVideo();
          showDrawerImage();
          return;
        }

        const src = list[idx];
        const onOk = () => {
          drawerVideoEl.removeEventListener("error", onErr);
          showDrawerVideo();
          try {
            drawerVideoEl.muted = true;
            drawerVideoEl.volume = 0;
            drawerVideoEl.play()?.catch?.(() => {});
          } catch {
            // ignore
          }
        };
        const onErr = () => {
          drawerVideoEl.removeEventListener("loadeddata", onOk);
          tryPlayVideoCandidates(list, idx + 1);
        };

        stopDrawerVideo();
        showDrawerVideo();
        try {
          drawerVideoEl.muted = true;
          drawerVideoEl.volume = 0;
          drawerVideoEl.src = src;
          drawerVideoEl.addEventListener("loadeddata", onOk, { once: true });
          drawerVideoEl.addEventListener("error", onErr, { once: true });
          drawerVideoEl.load();
        } catch {
          tryPlayVideoCandidates(list, idx + 1);
        }
      }

      function openDrawer(item, startIdx = 0) {
        if (!item) return;
        drawerFilenameEl.textContent = item.code || item.filename || "—";

        const variants = Array.isArray(item?.variants) ? item.variants : [];
        let active = 0;
        const setActive = (idx) => {
          active = idx;
          const v = variants[idx] || {};
          const src = (v?.image ?? v?.thumb ?? item?.image ?? item?.thumb ?? "").toString();
          const dimensions = imageDimensions(src);
          if (dimensions) {
            drawerImgEl.width = dimensions[0];
            drawerImgEl.height = dimensions[1];
          } else {
            drawerImgEl.removeAttribute("width");
            drawerImgEl.removeAttribute("height");
          }
          if (src) drawerImgEl.src = src;
          else drawerImgEl.removeAttribute("src");
          drawerImgEl.alt = (v?.filename ?? item?.code ?? "").toString();
          drawerCopyValue = (v?.filename ?? item?.code ?? item?.filename ?? "").toString();
          stopDrawerVideo();
          showDrawerImage();

          drawerImgEl.hidden = !src;
          $("#drawerMissingImage").hidden = !!src;

          for (const btn of drawerThumbsEl.querySelectorAll("button[data-idx]")) {
            btn.classList.toggle("active", Number(btn.getAttribute("data-idx")) === idx);
          }
          for (const btn of drawerThumbsEl.querySelectorAll("button[data-kind]")) {
            btn.classList.toggle("active", btn.getAttribute("data-kind") === "image" && Number(btn.getAttribute("data-idx")) === idx);
          }
        };

        drawerThumbsEl.innerHTML = "";

        const uncensored = isUncensoredItem(item);
        if (uncensored && getVideoIndex()) {
          const vbtn = document.createElement("button");
          vbtn.type = "button";
          vbtn.className = "thumbBtn videoBtn";
          vbtn.setAttribute("data-kind", "video");
          vbtn.title = "開啟對應影片（新分頁）";
          vbtn.innerHTML = `<span style="font-weight: 700">▶</span><span style="font-size: 12px; opacity: .85">影片</span>`;
          vbtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            openVideoPlayerForItem(item);
          });
          drawerThumbsEl.appendChild(vbtn);
        }

        if (variants.length > 1) {
          for (let i = 0; i < variants.length; i++) {
            const v = variants[i];
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "thumbBtn";
            btn.setAttribute("data-idx", String(i));
            btn.setAttribute("data-kind", "image");
            const src = (v?.thumb ?? v?.image ?? "").toString();
            btn.innerHTML = `<img alt="${escapeHtml(v.filename)}" src="${escapeHtml(src)}" ${imageSizeAttributes(src)} loading="lazy" decoding="async" />`;
            btn.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              for (const b of drawerThumbsEl.querySelectorAll("button[data-kind]")) b.classList.remove("active");
              btn.classList.add("active");
              setActive(i);
            });
            drawerThumbsEl.appendChild(btn);
          }
        }

        const safeStart = Number.isFinite(Number(startIdx)) ? Math.max(0, Math.min(variants.length - 1, Number(startIdx))) : 0;
        setActive(variants.length ? safeStart : 0);

        const decorationText = fmtMulti(item?.decoration);
        const materialText = item?.materialSimple || item?.material || "—";
        const colorText = fmtMulti(item?.color) || "—";
        drawerTagsEl.innerHTML = [
          tag(`款式：${item.style || "—"}`, true),
          tag(`鞋頭：${item.toe || "—"}`, true),
          tag(`鞋跟：${fmtMulti(item.heelStyle) || "—"}`, true),
          item?.censor ? tag(`碼別：${fmtMulti(item.censor)}`, true) : "",
          decorationText ? tag(`裝飾：${decorationText}`, true) : "",
          tag(`材質：${materialText}`, true),
          tag(`顏色：${colorText}`, true),
        ].join("");

        const related = getRelated(item, 12);
        drawerRelatedEl.innerHTML = "";
        for (const r of related) {
          const el = document.createElement("div");
          el.className = "relCard";
          const src = (r?.image ?? r?.thumb ?? "").toString();
          const title = r?.code || r?.filename || "";
          const count = Array.isArray(r?.variants) ? r.variants.length : Array.isArray(r?.filenames) ? r.filenames.length : 1;
          el.innerHTML = `
            ${src ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(title)}" ${imageSizeAttributes(src)} loading="lazy" decoding="async" />` : '<div class="missingImage">尚無圖片</div>'}
            <div class="relMeta">
              <div class="relName">${escapeHtml(title)}${count > 1 ? ` <span class="badge">×${count}</span>` : ""}</div>
              <div class="tags" style="gap: 6px">
                ${r.style ? tag(r.style, true) : ""}
                ${r.toe ? tag(r.toe, true) : ""}
                ${r.heelStyle ? tag(r.heelStyle, true) : ""}
              </div>
            </div>
          `;
          el.addEventListener("click", () => openDrawer(r));
          drawerRelatedEl.appendChild(el);
        }

        drawerEl.style.display = "block";
        drawerOverlayEl.style.display = "block";
        drawerEl.setAttribute("aria-hidden", "false");
      }

      function renderGrid(items) {
        gridEl.innerHTML = "";
        if (!items.length) {
          emptyEl.style.display = "block";
          return;
        }
        emptyEl.style.display = "none";

        for (const item of items) {
          const card = document.createElement("article");
          card.className = "card";
          const decorationText = fmtMulti(item?.decoration);
          const materialText = item?.materialSimple || item?.material || "—";
          const colorText = fmtMulti(item?.colorRaw || item?.color) || "—";
          const title = item?.code || item?.filename || "";
          const count = Array.isArray(item?.variants) ? item.variants.length : Array.isArray(item?.filenames) ? item.filenames.length : 1;
          const variants = Array.isArray(item?.variants) && item.variants.length ? item.variants : [];
          const fallbackSrc = (item?.image ?? item?.thumb ?? "").toString();
          const imgs = (variants.length ? variants : fallbackSrc ? [{ filename: item?.filename || title, image: fallbackSrc }] : []).map((v, i) => {
            const src = (v?.image ?? v?.thumb ?? fallbackSrc ?? "").toString();
            const alt = `${title}${count > 1 ? ` #${i + 1}` : ""}`;
            return `<div class="thumbItem" data-idx="${i}"><img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" ${imageSizeAttributes(src)} loading="lazy" decoding="async" /></div>`;
          });

          card.innerHTML = `
            ${imgs.length ? `<div class="thumbList">${imgs.join("")}</div>` : '<div class="missingImage">尚無圖片</div>'}
            <div class="meta">
              <div class="filename">
                <div>${escapeHtml(title)}${count > 1 ? ` <span class="badge">×${count}</span>` : ""}</div>
                <a class="small" href="#" data-copy="1" title="複製代碼">copy</a>
              </div>
              <div class="tags">
                ${tag(`款式：${fmtMulti(item.style) || "—"}`, true)}
                ${tag(`鞋頭：${fmtMulti(item.toe) || "—"}`, true)}
                ${tag(`鞋跟：${fmtMulti(item.heelStyle) || "—"}`, true)}
                ${decorationText ? tag(`裝飾：${decorationText}`, true) : ""}
                ${tag(`材質：${materialText}`, true)}
                ${tag(`顏色：${colorText}`, true)}
              </div>
            </div>
          `;

          const copyLink = card.querySelector("a[data-copy]");
          copyLink.addEventListener("click", async (e) => {
            e.preventDefault();
            try {
              await navigator.clipboard.writeText(title);
              copyLink.textContent = "copied";
              setTimeout(() => (copyLink.textContent = "copy"), 800);
            } catch {
              copyLink.textContent = "failed";
              setTimeout(() => (copyLink.textContent = "copy"), 800);
            }
          });

          // Click image(s) to open drawer; open at the clicked variant index.
          for (const el of card.querySelectorAll(".thumbItem[data-idx]")) {
            el.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              const idx = Number(el.getAttribute("data-idx") || "0") || 0;
              if (isUncensoredItem(item) && openVideoPlayerForItem(item)) return;
              openDrawer(item, idx);
            });
          }

          // Keep drawer accessible without forcing click-to-view variants
          card.querySelector(".filename > div")?.addEventListener("click", () => openDrawer(item, 0));

          gridEl.appendChild(card);
        }
      }

      function saveState() {
        const payload = {
          q: (qEl.value ?? "").toString(),
          selected: Object.fromEntries(groups.map((g) => [g.key, Array.from(selected[g.key] || [])])),
        };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch {
          // ignore
        }
      }

      function loadState() {
        isRestoringState = true;
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          qEl.value = (parsed?.q ?? "").toString();

          for (const g of groups) selected[g.key].clear();
          const sel = parsed?.selected ?? {};
          for (const g of groups) {
            const arr = Array.isArray(sel?.[g.key]) ? sel[g.key] : [];
            for (const v of arr) selected[g.key].add((v ?? "").toString());
          }

          for (const g of groups) {
            for (const v of selected[g.key]) {
              const input = document.getElementById(checkboxId(g.key, v));
              if (input) input.checked = true;
            }
          }
        } catch {
          // ignore
        } finally {
          isRestoringState = false;
        }
      }

      // UI init: image size slider
      (function initUi() {
        const ui = readUi();
        const start = Number(ui.gridColWidthPx);
        setGridColWidth(Number.isFinite(start) ? start : 340);

        const mode = (ui.gridMode ?? "auto").toString();
        const cnt = Number(ui.gridColCount);
        applyGridMode(mode === "fixed" ? "fixed" : "auto", Number.isFinite(cnt) ? cnt : 3);

        if (sizeRangeEl) {
          sizeRangeEl.addEventListener("input", () => {
            const v = Number(sizeRangeEl.value);
            setGridColWidth(v);
            writeUi({ gridColWidthPx: Number(sizeRangeEl.value) });
          });
        }

        if (colRangeEl) {
          colRangeEl.addEventListener("input", () => {
            const v = Number(colRangeEl.value);
            const m = autoColsEl && autoColsEl.checked ? "auto" : "fixed";
            applyGridMode(m, v);
            writeUi({ gridColCount: Number(colRangeEl.value) });
          });
        }

        if (autoColsEl) {
          autoColsEl.addEventListener("change", () => {
            const m = autoColsEl.checked ? "auto" : "fixed";
            const v = Number(colRangeEl?.value ?? 3);
            applyGridMode(m, v);
            writeUi({ gridMode: m });
          });
        }

        window.addEventListener("resize", () => {
          if (!(autoColsEl && autoColsEl.checked)) {
            const v = Number(colRangeEl?.value ?? 3);
            const px = approxColWidthPx(v);
            if (sizeValEl) sizeValEl.textContent = px ? `${px}` : "—";
          }
        });
      })();

      for (const g of groups) renderChecks(g);
      loadState();

      const presets = [
        {
          id: "pump_point",
          title: "包鞋（尖頭）",
          hint: "款式相似",
          iconSrc: "assets/preset-icons/pump.svg",
          filters: { style: ["包鞋"], toe: ["尖頭"] },
        },
        {
          id: "pump_round",
          title: "包鞋（圓頭）",
          hint: "款式相似",
          iconSrc: "assets/preset-icons/round.svg",
          filters: { style: ["包鞋"], toe: ["圓頭"] },
        },
        {
          id: "sandal",
          title: "涼鞋",
          hint: "款式相似",
          iconSrc: "assets/preset-icons/sandal.svg",
          filters: { style: ["涼鞋"] },
        },
        {
          id: "boot",
          title: "長靴",
          hint: "款式相似",
          iconSrc: "assets/preset-icons/boot.svg",
          filters: { style: ["長靴"] },
        },
        {
          id: "platform",
          title: "厚底（防水台）",
          hint: "裝飾相似",
          iconSrc: "assets/preset-icons/platform.svg",
          filters: { decoration: ["防水台"] },
        },
      ];

      function renderPresets() {
        presetsEl.innerHTML = "";
        for (const p of presets) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "presetBtn";
          btn.setAttribute("data-preset", p.id);
          btn.innerHTML = `
            <div class="presetTop">
              <div style="display: grid; gap: 4px">
                <div class="presetTitle">${escapeHtml(p.title)}</div>
                <div class="presetHint">${escapeHtml(p.hint)}</div>
              </div>
              <div class="presetIcon"><img alt="" src="${escapeHtml(p.iconSrc)}" /></div>
            </div>
          `;
          btn.addEventListener("click", () => applyPreset(p));
          presetsEl.appendChild(btn);
        }
      }

      renderPresets();
      inferActivePreset();

      let qTimer = null;
      qEl.addEventListener("input", () => {
        if (qTimer) clearTimeout(qTimer);
        qTimer = setTimeout(() => {
          apply();
          if (!isRestoringState) saveState();
          inferActivePreset();
        }, 80);
      });
      const toggleImagesEl = $("#toggleImages");
      function setImagesHidden(hidden) {
        document.body.classList.toggle("images-hidden", hidden);
        toggleImagesEl.textContent = hidden ? "顯示圖片" : "隱藏圖片";
        toggleImagesEl.setAttribute("aria-pressed", String(hidden));
      }
      setImagesHidden(true);
      toggleImagesEl.addEventListener("click", () => {
        const hidden = !document.body.classList.contains("images-hidden");
        setImagesHidden(hidden);
      });

      $("#shuffle").addEventListener("click", () => {
        for (let index = displayOrder.length - 1; index > 0; index--) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [displayOrder[index], displayOrder[swapIndex]] = [displayOrder[swapIndex], displayOrder[index]];
        }
        apply();
      });

      resetEl.addEventListener("click", () => {
        displayOrder = data.slice();
        qEl.value = "";
        for (const g of groups) selected[g.key].clear();
        for (const input of document.querySelectorAll('input[type="checkbox"]')) input.checked = false;
        apply();
        saveState();
        setActivePreset("");
      });

      drawerCloseEl.addEventListener("click", closeDrawer);
      drawerOverlayEl.addEventListener("click", closeDrawer);
      drawerCopyEl.addEventListener("click", async (e) => {
        e.preventDefault();
        const name = (drawerCopyValue ?? "").toString().trim();
        if (!name) return;
        try {
          await navigator.clipboard.writeText(name);
          drawerCopyEl.textContent = "copied";
          setTimeout(() => (drawerCopyEl.textContent = "copy"), 800);
        } catch {
          drawerCopyEl.textContent = "failed";
          setTimeout(() => (drawerCopyEl.textContent = "copy"), 800);
        }
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDrawer();
      });

      apply();
    </script>
  </body>
</html>
