<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Player</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f5f3;
        --panel: rgba(255, 255, 255, 0.92);
        --text: rgba(13, 13, 13, 0.92);
        --muted: rgba(13, 13, 13, 0.62);
        --border: rgba(13, 13, 13, 0.12);
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", Arial, "PingFang TC",
          "Microsoft JhengHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px 14px 28px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .title {
        font-size: 14px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
      }
      .panel {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 16px;
        overflow: hidden;
      }
      video {
        display: block;
        width: 100%;
        height: auto;
        background: #000;
      }
      .hint {
        padding: 10px 12px;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--border);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <a class="btn" href="index.html">← 回到列表</a>
        <div class="title" id="title">Video</div>
      </div>
      <div class="panel">
        <video id="v" controls autoplay muted playsinline preload="metadata"></video>
        <div class="hint">預設靜音。可在播放器右下角自行開啟音量。來源：<code id="src">—</code></div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const src = (params.get("src") || "").toString();
      const title = (params.get("title") || "").toString();

      const v = document.getElementById("v");
      const srcEl = document.getElementById("src");
      const titleEl = document.getElementById("title");

      titleEl.textContent = title ? `影片：${title}` : "影片";
      srcEl.textContent = src || "—";

      if (src) {
        v.src = src;
        try {
          v.muted = true;
          v.volume = 0;
        } catch {}
      }
    </script>
  </body>
</html>
